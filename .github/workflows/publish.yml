name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :forge:jarJar :neoforge:build

      - name: Extract versions
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          MOD_VER="${TAG#v}"
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "mod=${MOD_VER}" >> "$GITHUB_OUTPUT"
          echo "mc=${MC_VER}" >> "$GITHUB_OUTPUT"
          echo "forge=${MC_VER}-${MOD_VER}-forge" >> "$GITHUB_OUTPUT"
          echo "neoforge=${MC_VER}-${MOD_VER}-neoforge" >> "$GITHUB_OUTPUT"

      # ── Forge ────────────────────────────────────────────────────────────
      - name: Publish Forge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: forge/build/libs/emoji_deco-forge-*[0-9].jar
          name: Emoji & Deco ${{ steps.ver.outputs.forge }}
          version: ${{ steps.ver.outputs.forge }}
          version-type: release
          loaders: forge
          game-versions: ${{ steps.ver.outputs.mc }}
          java: 21

      # ── NeoForge ─────────────────────────────────────────────────────────
      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: neoforge/build/libs/emoji_deco-neoforge-*[0-9].jar
          name: Emoji & Deco ${{ steps.ver.outputs.neoforge }}
          version: ${{ steps.ver.outputs.neoforge }}
          version-type: release
          loaders: neoforge
          game-versions: ${{ steps.ver.outputs.mc }}
          java: 21
