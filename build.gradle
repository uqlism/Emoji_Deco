// Root project build script — delegates all work to subprojects (common, forge, neoforge).
// This file is intentionally minimal; actual build logic lives in subproject build.gradle files.

subprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net' }
    }
}
